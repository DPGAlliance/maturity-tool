services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maturity}
      POSTGRES_USER: ${POSTGRES_USER:-maturity}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: dpg_butler_api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-maturity}
      DB_USER: ${POSTGRES_USER:-maturity}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      API_KEY_FILE: /run/secrets/api_key
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      VIEWER_BASE_URL: ${VIEWER_BASE_URL:-http://localhost:8501}
    secrets:
      - postgres_password
      - api_key
      - github_token
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "dpg_butler_api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  adhoc_scan_worker:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-maturity}
      DB_USER: ${POSTGRES_USER:-maturity}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      API_KEY_FILE: /run/secrets/api_key
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      ADHOC_SCAN_POLL_SECONDS: ${ADHOC_SCAN_POLL_SECONDS:-5}
      ADHOC_SCAN_HEARTBEAT_SECONDS: ${ADHOC_SCAN_HEARTBEAT_SECONDS:-60}
      ADHOC_SCAN_MAX_RUNNING_SECONDS: ${ADHOC_SCAN_MAX_RUNNING_SECONDS:-7200}
      SUMMARY_BASE_URL: ${SUMMARY_BASE_URL:-http://api:8000}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-gpt-4o-mini}
      SUMMARY_HISTORY: ${SUMMARY_HISTORY:-5}
      SUMMARY_MAX_AGE_DAYS: ${SUMMARY_MAX_AGE_DAYS:-30}
    secrets:
      - postgres_password
      - github_token
      - api_key
      - openai_api_key
    command: ["python", "scripts/adhoc_scan_worker.py"]

  viewer:
    build:
      context: .
      dockerfile: data_viewer/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-maturity}
      DB_USER: ${POSTGRES_USER:-maturity}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      GITHUB_TOKEN_FILE: /run/secrets/github_token
    secrets:
      - postgres_password
      - github_token
    ports:
      - "127.0.0.1:8501:8501"
    command: ["streamlit", "run", "data_viewer/data_viewer/main.py", "--server.address", "0.0.0.0", "--server.port", "8501"]

  refresh_scheduler:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    restart: unless-stopped
    profiles: ["scheduler"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-maturity}
      DB_USER: ${POSTGRES_USER:-maturity}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      API_KEY_FILE: /run/secrets/api_key
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      REFRESH_INTERVAL_DAYS: ${REFRESH_INTERVAL_DAYS:-7}
      REFRESH_INTERVAL_SECONDS: ${REFRESH_INTERVAL_SECONDS:-}
      REFRESH_OWNERS: ${REFRESH_OWNERS:-}
      REFRESH_REPO: ${REFRESH_REPO:-}
      FORCE_REFRESH: ${FORCE_REFRESH:-false}
      RUN_SUMMARIES: ${RUN_SUMMARIES:-true}
      SUMMARY_BASE_URL: ${SUMMARY_BASE_URL:-http://api:8000}
    secrets:
      - postgres_password
      - github_token
      - api_key
      - openai_api_key
    command: ["python", "scripts/refresh_scheduler.py"]

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  api_key:
    file: ./secrets/api_key
  github_token:
    file: ./secrets/github_token
  openai_api_key:
    file: ./secrets/openai_api_key
